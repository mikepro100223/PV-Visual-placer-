# Local full-data experiment. Paths are relative to the repository root.
data: data/processed/swiss-pv/dataset.yaml
model: yolo11n-seg.pt
epochs: 50
imgsz: 512
batch: 8
device: auto
workers: 0
seed: 42
patience: 12
optimizer: AdamW
lr0: 0.001
lrf: 0.01
cos_lr: true
warmup_epochs: 3
degrees: 180.0
flipud: 0.5
fliplr: 0.5
scale: 0.25
mosaic: 0.5
close_mosaic: 8
mask_ratio: 2
amp: false
cache: false
plots: true
save_period: 5
